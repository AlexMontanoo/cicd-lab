name: Mi primer workflow

on: push

jobs:
  saludo:
    runs-on: ubuntu-latest
    steps:
      - name: Traer el codigo
        uses: actions/checkout@v4

      - name: Ver los archivos
        run: ls -la

      - name: Decir hola
        run: echo "Hola desde github"

      - name: Leer archivo que no existe
        run: cat d.txt

      - name: Contruir la imagen
        run: docker build -t mi-imagen .

      - name: Correr el contenedor
        run: docker run mi-imagen
      - name: Iniciar sesion en Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Ponerle nombre de Docker Hub
        run: docker tag mi-imagen ${{ secrets.DOCKERHUB_USERNAME }}/mi-imagen:latest

      - name: Subir la imagen
        run: docker push ${{ secrets.DOCKERHUB_USERNAME }}/mi-imagen:latest

      - name: Correr pruebas
        run: python3 test_suma.py
